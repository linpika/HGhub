services:
  cover:
    image: hghub-cover:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    volumes:
      - cover-data:/data
    environment:
      MEDIA_SOURCE: /app/media.rs
      PORT: ${PORT:-8787}
      COVER_SECRET_FILE: /data/secret
      COVER_PUBLIC_ORIGIN: https://img-2c812d1bf79fee03e88d.linpika.com
      TRUST_PROXY: ${TRUST_PROXY:?TRUST_PROXY is required}
    restart: unless-stopped

volumes:
  cover-data:
